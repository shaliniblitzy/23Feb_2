# =============================================================================
# Alembic configuration -- Inventory Service (inventory_db)
#
# This file is the canonical CLI configuration consumed by every
# ``alembic ...`` invocation issued from the inventory service. It centralizes
# the migration script discovery rules, the generated revision filename
# template, the database URL resolution policy, and the logging bootstrap
# for ``logging.config.fileConfig()`` invoked by env.py.
#
# See ./README.md for the local workflow walkthrough; ./env.py for the
# runtime POSTGRES_URL resolution; ./script.py.mako for the body template
# applied to every newly-generated revision file.
#
# Owned database: inventory_db (PostgreSQL 16)
# Owned schema:   warehouses, stock_items, reservations, reservation_items,
#                 stock_movements   (AAP Section 0.4.4)
#
# Version table:  alembic_version_inventory_service
#                 The version table name is configured PROGRAMMATICALLY in
#                 env.py via ``context.configure(version_table=...)`` -- the
#                 supported Alembic API for setting a service-specific version
#                 table -- and is the single source of truth for the value
#                 ``alembic_version_inventory_service``. The constant
#                 ``_VERSION_TABLE_NAME`` in env.py is intentionally exposed
#                 in code (NOT in this INI) to keep it grep-able and
#                 unit-testable. Do NOT add a ``version_table = ...`` line in
#                 the [alembic] section here; INI-level support for that
#                 option is undocumented in Alembic 1.13+ and any such line
#                 here would be silently ignored, creating a misleading second
#                 source of truth.
#
# AAP references:
#   * AAP Section 0.4.4   -- inventory_db schema (warehouses, stock_items,
#                            reservations, reservation_items, stock_movements)
#   * AAP Section 0.5.2.5 -- Per-service migrations live under the owning
#                            service's migrations/ folder
#   * AAP R-9             -- Migrations colocated with owning service,
#                            applied automatically on service startup
#                            (RUN_MIGRATIONS_ON_STARTUP=true in local dev
#                            compose; initContainer / K8s migration Job in
#                            production deployments)
#   * AAP R-25            -- Secrets never appear in source or config files;
#                            sqlalchemy.url is INTENTIONALLY EMPTY here and
#                            is injected at runtime by env.py from the
#                            POSTGRES_URL environment variable
#
# Operational policy -- forward-only:
#   Production deployments run ``alembic upgrade head`` exclusively.
#   Downgrades are FORBIDDEN in production; corrective action is a NEW
#   forward revision. The downgrade() bodies in versions/*.py exist solely
#   for local dev convenience and CI round-trip integrity tests
#   (upgrade -> downgrade -> upgrade). See README.md in this directory for
#   the full operator workflow walkthrough.
#
# CLI usage (run from this directory):
#   cd services/inventory-service/migrations
#   alembic upgrade head              # apply all pending revisions
#   alembic current                   # show currently-applied revision
#   alembic history                   # show revision graph
#   alembic revision -m "create_foo"  # generate new revision skeleton
#
# Percent-sign escaping reference (configparser semantics):
#   * file_template uses %% to escape % literally so configparser passes
#     through the single % that Alembic's own renderer expects.
#   * version_locations uses %(here)s -- single % -- for configparser's
#     built-in interpolation magic that resolves to the directory
#     containing this alembic.ini.
#   * Logging [formatter_generic] uses single % for asctime/levelname/
#     name/message because those are Python LogRecord attributes;
#     configparser's interpolation is disabled inside [formatter_*]
#     sections by Alembic's parser configuration. Doubling these would
#     emit literal "%%" strings in log output.
#
# This file follows the same layout as
# services/order-service/migrations/alembic.ini,
# services/payment-service/migrations/alembic.ini, and
# services/notification-service/migrations/alembic.ini for monorepo
# consistency -- operators familiar with one service's migration tooling
# can immediately work on the others. Only the header comment narrative
# (which mentions the service name, database name, and version table)
# varies between the four sibling files.
# =============================================================================

[alembic]
# Path to the migration scripts directory. Alembic CLI is invoked from this
# directory (services/inventory-service/migrations/), so "." resolves to
# "the directory containing this alembic.ini file". Operators who prefer an
# absolute path reference from a different working directory can substitute
# the %(here)s token, which Alembic also recognizes here.
script_location = .

# Generated revision filename template. Each %%(...) token is substituted by
# Alembic at generation time; the doubled %% is required to escape Python
# configparser's interpolation sigil so a single literal % reaches Alembic's
# renderer.
#
# Token reference:
#   %%(year)d          -- 4-digit year
#   %%(month).2d       -- zero-padded month
#   %%(day).2d         -- zero-padded day
#   %%(hour).2d        -- zero-padded hour
#   %%(minute).2d      -- zero-padded minute
#   %%(second).2d      -- zero-padded second
#   %%(slug)s          -- snake_case slug derived from the -m "message" arg
#
# Example generated filename:
#   20260101_000001_create_warehouses.py
#
# The _<slug> suffix makes filenames self-documenting; the timestamp prefix
# provides deterministic chronological ordering independent of creation
# order inside the versions/ directory.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Truncate the slug at N characters to keep filenames under the filesystem
# per-component limit. 40 characters leaves headroom for the timestamp
# prefix and the .py extension; this value is shared with the order,
# payment, and notification services for monorepo consistency.
truncate_slug_length = 40

# Location(s) where Alembic searches for revision files. A single location
# ("versions") is the Alembic convention. %(here)s expands to the directory
# containing this ini file, which keeps the configuration portable across
# operator working directories. Single % is correct here because ``here``
# is a configparser-supplied magic key (NOT an Alembic placeholder); do
# NOT escape this to %%(here)s.
version_locations = %(here)s/versions

# Character used to join multiple version_locations entries when more than
# one is defined. "os" picks the OS-native path separator (":" on POSIX,
# ";" on Windows), which is the modern (Alembic 1.7+) recommendation and
# avoids cross-platform parsing surprises in CI runners.
version_path_separator = os

# Timezone applied to the file_template timestamp tokens. "UTC" produces a
# single, unambiguous value across all contributor laptops and CI runners.
# Omitting this would let Alembic use the local machine's timezone, which
# can lead to cross-contributor filename prefix collisions or confusing
# out-of-order revision histories in the versions/ directory.
timezone = UTC

# Output encoding for ``alembic upgrade head --sql`` redirected to a file.
# Forces UTF-8 regardless of the runner's locale; guards against locale-
# dependent encoding when operators pipe offline-mode SQL output to a file
# or psql (e.g. a CREATE TABLE with a default value containing non-ASCII
# characters like 'São Paulo' would be mangled without this).
output_encoding = utf-8

# ---------------------------------------------------------------------------
# Database URL -- INTENTIONALLY EMPTY.
#
# Per AAP R-25 (secrets never in source or configuration files), the
# connection URL is resolved at runtime from the POSTGRES_URL environment
# variable by env.py via ``config.set_main_option("sqlalchemy.url", ...)``.
#
# Leaving this line blank is REQUIRED:
#   * If the value is non-empty, SQLAlchemy will use it verbatim, bypassing
#     env.py's runtime fallback and possibly exposing committed credentials
#     -- a Sev-1 security incident.
#   * If the value is non-empty BUT contains a placeholder, alembic will
#     attempt to connect to a nonsensical host and fail with an opaque DNS
#     error rather than the clear "POSTGRES_URL not set" message env.py
#     raises.
#
# A reviewer who sees a non-empty value here MUST reject the change.
# ---------------------------------------------------------------------------
sqlalchemy.url =

# ---------------------------------------------------------------------------
# Optional knobs intentionally left at Alembic defaults / unset:
#
#   transaction_per_migration -- env.py controls this explicitly via
#       transaction_per_migration=True passed to context.configure(); we do
#       NOT set it here to avoid a duplicate / conflicting source of truth.
#
#   sourceless -- false (default); we do not want Alembic to treat .pyc
#       files in versions/ as authoritative.
#
#   revision_environment -- false (default); env.py is loaded only on
#       ``alembic upgrade`` / ``downgrade`` / ``current`` / ``history``,
#       not on ``revision`` (which keeps offline revision generation fast).
#
#   version_table -- INTENTIONALLY ABSENT here. The supported Alembic API
#       for setting a service-specific version table is to pass
#       version_table=... to context.configure() in env.py, which we do
#       (env.py declares
#       _VERSION_TABLE_NAME = "alembic_version_inventory_service").
# ---------------------------------------------------------------------------


[post_write_hooks]
# post_write_hooks can run formatters / linters against newly-generated
# revision files. Left commented out because the repo-wide CI workflow
# already runs ruff/black across the whole services/inventory-service/ tree;
# applying them twice (once here on revision creation and once in CI)
# produces noisy git diffs and surprising behavior for contributors who
# regenerate revisions locally.
#
# The section header MUST exist even when empty -- some Alembic code paths
# inspect [post_write_hooks] for presence and raise on missing-section
# errors. Keeping the empty section header ensures forward-compatibility
# while leaving every hook disabled.
#
# To enable hooks, uncomment one or more of the example key lines below.
# Do NOT enable without coordinating with the platform team -- revision
# formatting is centralized in the repo-wide pre-commit configuration.
#
# Example (uncomment to enable):
# hooks = ruff,black
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME


# ---------------------------------------------------------------------------
# Logging configuration -- consumed by ``logging.config.fileConfig()`` in
# env.py. The schema MUST be complete (loggers/handlers/formatters keys
# + one section per name) even though env.py may override log levels at
# runtime via the ALEMBIC_LOG_LEVEL environment variable, because
# fileConfig() raises on missing-section errors.
#
# Three named loggers:
#   * root        -- catch-all for anything not explicitly configured (WARN)
#   * sqlalchemy  -- SQLAlchemy engine chatter; WARN to suppress per-query
#                    DDL noise during ``alembic upgrade head``
#   * alembic     -- Alembic's own INFO messages (revision applied, etc.)
#
# A single console handler writes to STDERR (NOT stdout) so stdout can be
# used for ``alembic upgrade head --sql`` SQL output piping to a file --
# preserving Unix pipeline semantics.
#
# The service's structured JSON logging (see ../config/log_config.json) is
# NOT applied to Alembic runs by design: migrations are typically inspected
# by operators during a deploy, and human-readable output is preferable for
# kubectl logs / docker logs / journalctl tailing. AAP R-27 (logs shipped
# via Filebeat to Logstash) still applies for the long-running service
# runtime; migrations are short-lived initContainers / Jobs whose output
# is captured by the orchestrator.
#
# Percent-sign rules in [formatter_generic] below:
#   * %(asctime)s, %(levelname)-5.5s, %(name)s, %(message)s are Python
#     logging LogRecord attributes -- SINGLE `%` is correct because
#     configparser does not see asctime/levelname/name/message as keys
#     and passes them through to the logging module untouched.
#   * %Y-%m-%d %H:%M:%S in datefmt are strftime format codes -- also
#     single `%`.
#   * Doubled `%%` here would cause logging to emit literal "%%" strings,
#     which is the most common Alembic INI copy/paste mistake.
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
# Root logger -- WARN keeps third-party library noise down. env.py may
# promote the alembic logger to INFO via the ALEMBIC_LOG_LEVEL env var, but
# we do NOT promote root to avoid pulling in noisy chatter from unrelated
# libraries that happen to be imported during model autogeneration.
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
# SQLAlchemy's ``engine`` logger emits every SQL statement at INFO. We keep
# it at WARN so ``alembic upgrade head`` does not flood stderr with DDL;
# operators can promote this to INFO via ALEMBIC_LOG_LEVEL during debugging
# to see the exact SQL Alembic is running against the database.
level = WARN
handlers =
qualname = sqlalchemy.engine
propagate = 0

[logger_alembic]
# Alembic's own logger -- INFO is the default because operators want to see
# "Running upgrade X -> Y" lines on every migration apply during deployment.
# ALEMBIC_LOG_LEVEL=DEBUG enables full Alembic introspection output.
# propagate = 0 prevents duplicate output via the root logger's console
# handler.
level = INFO
handlers =
qualname = alembic
propagate = 0

[handler_console]
# Stream to STDERR specifically so STDOUT is reserved for SQL output of
# ``alembic upgrade head --sql`` (operators frequently pipe stdout to a
# file for review before applying to production). args is a Python tuple
# literal evaluated by configparser's logging.config parser; (sys.stderr,)
# is the canonical Alembic template value.
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# Short, human-readable timestamp + level + name + message.
# Example output:
#   2026-01-01 00:00:01 INFO  [alembic.runtime.migration] Running upgrade ...
#
# This format is consistent across all four migration alembic.ini files
# (notification, order, payment, inventory) so operators can tail logs
# across services with the same regex.
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
