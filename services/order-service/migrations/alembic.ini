; ----------------------------------------------------------------------------
; Alembic CLI configuration -- Order Service / order_db
;
; This file is the canonical CLI configuration consumed by every
; `alembic <subcommand>` invocation issued from the Order Service's
; migrations directory. It centralizes migration script discovery rules,
; the generated revision filename template, the database URL resolution
; policy, and the logging bootstrap for `logging.config.fileConfig()`
; invoked by env.py.
;
; This file configures the `alembic` CLI for the Order Service's private
; PostgreSQL database (order_db). Per AAP R-9 it is colocated with env.py
; and versions/ inside services/order-service/migrations/.
;
; AAP R-25 compliance: sqlalchemy.url is INTENTIONALLY LEFT EMPTY. The
;   actual database URL is resolved at runtime from the POSTGRES_URL
;   environment variable by env.py via
;   config.set_main_option("sqlalchemy.url", ...). Do NOT add credentials,
;   hostnames, ports, usernames, passwords, or any other secret material
;   here.
;
; Version table: env.py configures Alembic with
;   version_table="alembic_version_order_service" via
;   context.configure(version_table=...) so this database's migration
;   state never collides with sibling services in a shared dev compose.
;   This setting is NOT exposed via INI -- Alembic does not provide an
;   INI-level setting for version_table, so any `version_table = ...`
;   line here would be silently ignored.
;
; Forward-only policy: production deployments run `alembic upgrade head`.
;   Downgrades are FORBIDDEN in production; corrective action is a NEW
;   forward revision. See README.md in this directory for the full
;   operator workflow walkthrough.
;
; AAP references:
;   * AAP Section 0.4.4   -- order_db schema (orders, order_items,
;                            order_status_history, saga_state)
;   * AAP Section 0.5.2.5 -- Per-service migrations live under the
;                            owning service's migrations/ folder
;   * AAP R-9             -- Migrations colocated with owning service,
;                            applied automatically on service startup
;                            or via a dedicated migration job
;   * AAP R-18            -- Order Service implements the saga pattern
;                            with explicit compensation steps for
;                            inventory release and payment reversal on
;                            failure (saga_state table is migrated here)
;   * AAP R-25            -- Secrets never appear in source or config
;                            files; sqlalchemy.url is empty here and is
;                            injected at runtime by env.py from the
;                            POSTGRES_URL environment variable
;
; This file follows the same layout as
; services/payment-service/migrations/alembic.ini and
; services/notification-service/migrations/alembic.ini for monorepo
; consistency -- operators familiar with one service's migration tooling
; can immediately work on the others.
; ----------------------------------------------------------------------------

[alembic]

; Path to migration scripts. Resolved relative to this alembic.ini file's
; directory, which IS the migrations folder. Alembic CLI is invoked from
; this directory (services/order-service/migrations/), so "." resolves to
; "the directory containing this alembic.ini file".
script_location = .

; Template for newly-generated revision filenames. Embeds:
;   - UTC timestamp (YYYYMMDD_HHMMSS) -- sortable in directory listings.
;   - Slug derived from `-m "..."` argument -- human-readable hint.
;
; Note configparser %% escaping: each %(...)d Alembic placeholder is
; written as %%(...)d here so configparser does not perform its own
; substitution on these tokens. Alembic itself sees `%(year)d` etc.
; after configparser runs and substitutes correctly.
;
; Token reference:
;   %%(year)d          -- 4-digit year
;   %%(month).2d       -- zero-padded month
;   %%(day).2d         -- zero-padded day
;   %%(hour).2d        -- zero-padded hour
;   %%(minute).2d      -- zero-padded minute
;   %%(second).2d      -- zero-padded second
;   %%(slug)s          -- snake_case slug derived from the -m "message" arg
;
; Example generated filename:
;   20260101_000001_initial_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

; Cap the auto-derived slug at 40 chars so filenames remain reasonable on
; filesystems with short path limits (Windows compose dev environments).
truncate_slug_length = 40

; Where revision .py files live. %(here)s is configparser's built-in
; magic value for the directory containing this alembic.ini, i.e.,
; services/order-service/migrations/. Single `%` is correct here because
; `here` IS a configparser-supplied key (NOT an Alembic placeholder).
; DO NOT escape this to %%(here)s.
version_locations = %(here)s/versions

; OS-native path separator used to join multiple version_locations
; entries. "os" picks ":" on POSIX and ";" on Windows -- the modern
; (Alembic 1.7+) recommendation that avoids cross-platform parsing
; surprises in CI.
version_path_separator = os

; All Alembic-generated timestamps in revision filenames and revision
; metadata are UTC. Avoids tz-shift confusion in CI logs, audit trails,
; and cross-contributor filename prefix collisions.
timezone = UTC

; Output encoding for `alembic upgrade head --sql` redirected to file.
output_encoding = utf-8

; sqlalchemy.url is INTENTIONALLY EMPTY -- env.py reads POSTGRES_URL from
; the environment at runtime (AAP R-25). Leaving this key present-but-empty
; is required because some Alembic code paths reference it; env.py overrides
; it via config.set_main_option("sqlalchemy.url", ...) before connect.
;
; If this value is non-empty, SQLAlchemy will use it verbatim, bypassing
; env.py's runtime fallback and possibly exposing committed credentials --
; a Sev-1 security incident. Leave the line BLANK after the `=`.
sqlalchemy.url =


; ----------------------------------------------------------------------------
; Post-write hooks -- run formatters/linters on newly generated revision
; files. Disabled in this monorepo: revision files are hand-edited and
; formatted by the project-wide pre-commit hooks (ruff, black) so we do
; not duplicate that logic here. Applying formatters twice (once on
; revision creation and once in CI) produces noisy git diffs and
; surprising behavior for contributors who regenerate revisions locally.
;
; The section header below is INTENTIONALLY PRESENT but has no enabled
; keys. Some Alembic code paths inspect [post_write_hooks] for presence
; and raise on missing-section errors; keeping the empty section header
; ensures forward-compatibility while leaving every hook disabled.
;
; To enable hooks, uncomment one or more of the example key lines below.
; Do NOT enable without coordinating with the platform team -- revision
; formatting is centralized in the repo-wide pre-commit configuration.
; ----------------------------------------------------------------------------

[post_write_hooks]
; hooks = black
; black.type = console_scripts
; black.entrypoint = black
; black.options = -l 100 REVISION_SCRIPT_FILENAME


; ----------------------------------------------------------------------------
; Logging configuration -- consumed by `logging.config.fileConfig()` in
; env.py. The schema MUST be complete (loggers/handlers/formatters keys
; + one section per name) even though env.py may override log levels at
; runtime via the ALEMBIC_LOG_LEVEL environment variable, because
; fileConfig() raises on missing-section errors.
;
; Three named loggers:
;   * root        -- catch-all for anything not explicitly configured (WARN)
;   * sqlalchemy  -- SQLAlchemy engine chatter; WARN to suppress per-query
;                    DDL noise during `alembic upgrade head`
;   * alembic     -- Alembic's own INFO messages (revision applied, etc.)
;
; A single console handler writes to STDERR (NOT stdout) so stdout can be
; used for `alembic upgrade head --sql` SQL output piping to a file.
;
; Percent-sign rules in [formatter_generic] below:
;   * %(asctime)s, %(levelname)-5.5s, %(name)s, %(message)s are Python
;     logging LogRecord attributes -- SINGLE `%` is correct because
;     configparser does not see asctime/levelname/name/message as keys
;     and passes them through to the logging module untouched.
;   * %H:%M:%S in datefmt are strftime format codes -- also single `%`.
;   * Doubled `%%` here would cause logging to emit literal "%%" strings,
;     which is the most common Alembic INI copy/paste mistake.
; ----------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
; Root logger -- WARN keeps third-party library noise down. env.py
; promotes the alembic logger (NOT root) to ALEMBIC_LOG_LEVEL when that
; env var is set, so unrelated libraries imported during model
; autogeneration stay quiet.
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
; SQLAlchemy's `engine` logger emits every SQL statement at INFO. We keep
; it at WARN so `alembic upgrade head` does not flood stderr with DDL;
; operators can promote this to INFO during debugging to see the exact
; SQL Alembic is running against the database.
level = WARN
handlers =
qualname = sqlalchemy.engine
propagate = 0

[logger_alembic]
; Alembic's own logger -- INFO surfaces "Running upgrade X -> Y" lines on
; every migration apply, useful in CI logs. propagate = 0 prevents
; duplicate output via the root logger's console handler.
level = INFO
handlers =
qualname = alembic
propagate = 0

[handler_console]
; Stream to STDERR specifically so STDOUT is reserved for SQL output of
; `alembic upgrade head --sql` (operators frequently pipe stdout to a
; file for review before applying to production).
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
; Short, human-readable timestamp + level + name + message.
; Example output:
;   12:34:56 INFO  [alembic.runtime.migration] Running upgrade abc -> def
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
